<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paws &amp; Pantries</title>

<style>
  :root { --ink:#141414; --paper:#F7F5F0; --accent:#CC0033; --muted:#55525C; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--paper); color:var(--ink); font:18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px 16px; }
  main { max-width:560px; }
  h1 { font-size:clamp(36px, 8vw, 56px); line-height:1.05; margin:0 0 16px; letter-spacing:-1px; }
  h1 span { color:var(--accent); }
  p { margin:0 0 12px; }
  .es { color:var(--muted); }
  .tag { display:inline-block; margin-bottom:20px; padding:4px 12px; border:2px solid var(--ink); border-radius:999px; font-weight:700; font-size:14px; }
</style>
</head>
<body>
<main>
  <span class="tag">Coming November 2026</span>
  <h1>Paws <span>&amp;</span> Pantries</h1>
  <p>Free pet food and low-cost pet care help in New Jersey, starting with Middlesex County.</p>
  <p class="es" lang="es">Ayuda gratuita con comida para mascotas y atención veterinaria de bajo costo en Nueva Jersey.</p>
</main>
</body>
</html>
